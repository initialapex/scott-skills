schema_version: "1.1"
name: fx2-oop-on-8051
expected_outcome: |
  Explains that blanket use of ops tables and self pointers is costly on the 8051, recommends compile-time or link-time binding for the I2C HAL and file-scope state for single-instance modules, keeps a code-space command table for vendor requests, and shows SDCC memory-space qualifiers and the SUDAV, SYNCDELAY and interrupt-flag rules.
